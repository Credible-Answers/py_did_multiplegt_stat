name: Release

# Publishing a GitHub Release is the single release action. The release tag is
# the package version source, so no version file needs to be edited manually.
on:
  release:
    types: [published]

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions use the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import email
          import glob
          import os
          import zipfile

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          wheel = glob.glob("dist/*.whl")
          if len(wheel) != 1:
              raise SystemExit(f"Expected one wheel, found: {wheel}")
          with zipfile.ZipFile(wheel[0]) as archive:
              metadata_name = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(
                  f"Release tag {expected!r} does not match built package version {actual!r}."
              )
          print(f"Verified package version {actual}")
          PY

      - name: Validate package metadata
        run: twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/did-multiplegt-stat
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach distributions to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GH_REPO"

  docs:
    name: Deploy tagged documentation
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
